<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>作品票選</title>
<style>
:root{--ink:#14202B;--bg:#F2F6F8;--acc:#0E7C86;--on:#fff;--mut:#5B6B77}
@media (prefers-color-scheme:dark){:root{--ink:#E8EEF2;--bg:#101A21;--acc:#3CC4CF;--on:#07181B;--mut:#9AABB7}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
main{width:100%;max-width:420px}
h1{font-size:1.6rem;line-height:1.35;margin:0 0 8px}
p{margin:0 0 28px;color:var(--mut);line-height:1.6}
button,select,input{width:100%;font:inherit;font-size:1.15rem;padding:16px;border-radius:12px;border:2px solid var(--acc)}
button{background:var(--acc);color:var(--on);font-weight:700}
button:disabled{opacity:.6}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
select,input{background:var(--bg);color:var(--ink);margin-bottom:12px}
input{text-transform:uppercase;letter-spacing:.2em;text-align:center}
.sm{margin:14px 0 0;font-size:.95rem}
.err{color:#C0392B;margin:14px 0 0}
</style>
</head>
<body>
<main id="app"><p>載入中…</p></main>
<script src="config.js"></script>
<script>
const KEY = "ticket";
const app = document.getElementById("app");
const qs = new URLSearchParams(location.search);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const who = w => w.author === "待確認" ? "" : w.author;
const left = n => `你還有 ${n} 票`;
const MSG = {
  badticket: "這張票無法使用,請洽工作人員。",
  limit: "這張票的票數已經用完,謝謝你的參與!",
  bad: "資料有誤,請重新掃描 QR code。"
};

let ticket = (qs.get("t") || "").trim().toUpperCase();
if (ticket) { try { localStorage.setItem(KEY, ticket); } catch (e) {} }
else { try { ticket = localStorage.getItem(KEY) || ""; } catch (e) {} }

const call = body => fetch(API, {method: "POST", headers: {"Content-Type": "text/plain"},
  body: JSON.stringify({t: ticket, ...body})}).then(r => r.json());
const note = (h, p) => { app.innerHTML = `<h1>${h}</h1><p>${p}</p>`; };

function home(list, info) {
  if (info.left <= 0) return note("票數已用完", MSG.limit);
  app.innerHTML = `<h1>${left(info.left)}</h1><p>請掃描展位上的 QR code,選出你最喜歡的作品。每件作品只能投一次。</p>
    <select id="sel"><option value="">或從清單選擇作品…</option>${list.map(w => `<option value="${w.id}">${esc(w.school)}${who(w) ? "|" + esc(who(w)) : ""}</option>`).join("")}</select>
    <button id="ok">前往投票</button>`;
  document.getElementById("ok").onclick = () => {
    const w = list.find(x => x.id === document.getElementById("sel").value);
    if (w) show(w, info);
  };
}

function show(w, info) {
  if (info.voted.includes(w.id)) return note("已投過這件作品", `${esc(w.school)}。${left(info.left)},可以再去看看其他作品。`);
  if (info.left <= 0) return note("票數已用完", MSG.limit);
  app.innerHTML = `<h1>${esc(w.school)}</h1><p>${esc(who(w))}</p>
    <button id="go">投給這件作品</button><div class="sm">${left(info.left)}</div><div class="err" id="err"></div>`;
  const btn = document.getElementById("go");
  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = "送出中…";
    try {
      const j = await call({action: "vote", id: w.id});
      if (j.ok) {
        info = {left: j.left, voted: [...info.voted, w.id]};
        return note("投票成功!", `${esc(w.school)}。${info.left > 0 ? left(info.left) + ",繼續逛其他展位吧。" : "你的票都投完了,謝謝!"}`);
      }
      if (j.err === "dup") { info.voted.push(w.id); return show(w, info); }
      if (j.err === "limit") return note("票數已用完", MSG.limit);
      throw new Error(j.err);
    } catch (e) {
      btn.disabled = false; btn.textContent = "投給這件作品";
      document.getElementById("err").textContent = "投票沒有送出,請確認網路後再按一次。";
    }
  };
}

function askTicket(msg) {
  app.innerHTML = `<h1>請輸入票號</h1><p>票券上有 6 碼票號。如果你已經掃過票券卻看到這個畫面(例如換了瀏覽器),輸入票號即可繼續投票。</p>
    <input id="tk" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="例如 AB3K7M">
    <button id="ok">確認票號</button><div class="err">${msg || ""}</div>`;
  document.getElementById("ok").onclick = () => {
    ticket = document.getElementById("tk").value.trim().toUpperCase();
    if (!ticket) return;
    try { localStorage.setItem(KEY, ticket); } catch (e) {}
    start();
  };
}

async function start() {
  try {
    const list = await fetch("schools.json").then(r => r.json());
    if (!ticket) return askTicket();
    const info = await call({action: "check"});
    if (!info.ok) {
      ticket = "";
      try { localStorage.removeItem(KEY); } catch (e) {}
      return askTicket(MSG[info.err] || MSG.badticket);
    }
    const w = list.find(x => x.id === qs.get("id"));
    w ? show(w, info) : home(list, info);
  } catch (e) {
    note("讀取失敗", "請確認網路後重新掃描 QR code。");
  }
}
start();
</script>
</body>
</html>
